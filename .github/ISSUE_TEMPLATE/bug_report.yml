name: Bug report
description: Report a reproducible Awakepilot problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Awakepilot. Please remove any private details before attaching diagnostics.
  - type: input
    id: version
    attributes:
      label: Awakepilot version
      placeholder: 0.11.0 (24)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.6, MacBook Air M3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us what you did and what happened.
      placeholder: |
        1. Open…
        2. Choose…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional. In Awakepilot, open About and choose “Save diagnostic report…”. Review the JSON before attaching it.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed attached files and removed any information I do not want to share.
          required: true
